site_name: HGA Research Foundation
site_description: Reproducibility, theory boundaries, and public API contracts
repo_url: https://github.com/arreasonn-jpg/hiper_geometrik_ai
repo_name: arreasonn-jpg/hiper_geometrik_ai
# Existing research reports link to source artifacts outside docs/. Keep those
# links literal while strict mode still catches MkDocs configuration/build errors.
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore
    unrecognized_links: ignore
nav:
  - Home: index.md
  - Reproduction: REPRODUCE_ALL.md
  - Experiment manifests: REPRODUCIBLE_EXPERIMENTS.md
  - CKPT-001: CKPT-001.md
  - CKPT-002 (experimental): CKPT-002.md
  - CKPT-003 (planned scale): CKPT-003.md
  - Theory: THEORETICAL_FRAMEWORK.md
  - Foundation diagnostics: FOUNDATION_ANALYSIS.md
  - Theory scope / review map: FOUNDATION_THEORY_SCOPE.md
  - API: api.md
  - Bilingual benchmark: BILINGUAL_BENCHMARK.md
  - Contribution: CONTRIBUTING.md
  - Publication gate: PUBLICATION_CHECKLIST.md
