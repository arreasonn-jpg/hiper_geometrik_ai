name: HGA CI

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Architecture Validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Tek bağımlılık kaynağı: pyproject.toml
          pip install -e ".[test]"

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Run Architecture Smoke Test
        run: |
          python test_mimari.py

      - name: Run CLI Smoke Tests
        run: |
          python -m hga bilgi
          python -m hga benchmark
          python -m hga golden-benchmark
          python -m hga golden-benchmark --seeds 1,2,3,4,5 --experiment-root /tmp/hga-experiments
          python -m hga memory-benchmark --scales 100,1000 --slots 256 --tables 1,2 --experiment-root /tmp/hga-memory-experiments
          python -m hga kronecker-benchmark --n 8 --steps 20 --batch 8 --seeds 1 --experiment-root /tmp/hga-kronecker-experiments
          python -m hga self-learning-benchmark --cycles 5 --batch 8 --initial-facts 4 --operands-max 4 --negatives-per-fact 3 --seeds 1 --experiment-root /tmp/hga-self-learning-experiments
          python -m hga bilgi-surum
          python -m hga defter
          python -m hga kapasite --operands-max 5
          python -m hga kronecker-rank --n-values 4,8 --k-values 1,2
          python -m hga koken
          python -m hga oncelik
          python -m hga olcekli-golden --sizes 100,400 --seeds 1,2 --hard
          python -m hga memory-interference --slots 512 --forced-collisions 10 --scales 100,1000
          python -m hga paradigma --seeds 1,2 --epochs 20
          python -m hga milestone --cycles 5 --batch 8 --initial-facts 6 --operands-max 8 --negatives-per-fact 3 --seeds 1 --checkpoints 0,5 --experiment-root /tmp/hga-milestone-experiments
